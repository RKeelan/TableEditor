name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # No bun here, deliberately: a checkout has no assets/index.html, the build
  # script embeds the placeholder, and everything Rust still has to pass. That
  # is what keeps a Rust contributor from needing a JavaScript toolchain.
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets --release

      - name: Test
        run: cargo test --all-targets

      # --all-targets does not take in doctests, and the README's consumer
      # example is only as good as the examples in the crate's own docs.
      - name: Doctests
        run: cargo test --doc

      # The crate is also depended on with default-features = false, for the
      # file format alone, so that configuration is a gate of its own.
      - name: Clippy (no default features)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Test (no default features)
        run: cargo test --no-default-features

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install
        run: bun install --frozen-lockfile

      # Before the tests, because one of them reads the built page: the page is
      # not in the repository, so there is nothing to read until it is built.
      - name: Build
        run: bun run build

      - name: Test
        run: bun test

  # A release is this job with the publish switch thrown, so the path that
  # uploads is the path that runs on every change. It builds the bundle,
  # packages the crate, checks that the page inside the package is the built
  # editor rather than the placeholder, and dry-runs the publish.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Release dry run
        shell: pwsh
        run: ./Release.ps1

  # Process spawning, browser discovery, and the detached worker are all
  # platform-specific, and Windows is where the editor is used.
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

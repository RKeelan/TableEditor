name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets --release

      - name: Test
        run: cargo test --all-targets

      # --all-targets does not take in doctests, and the README's consumer
      # example is only as good as the examples in the crate's own docs.
      - name: Doctests
        run: cargo test --doc

      # The crate is also depended on with default-features = false, for the
      # file format alone, so that configuration is a gate of its own.
      - name: Clippy (no default features)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Test (no default features)
        run: cargo test --no-default-features

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      # Type-checks and then builds, writing ../assets/index.html. What that
      # page must be is asserted by the tests above, which read the committed
      # one, and by the crate's own test on what it embeds.
      - name: Build
        run: bun run build

      # The committed page is what consumers get, so it has to be the page
      # these sources build. Vite is pinned and so is bun, which is what makes
      # this comparable at all.
      - name: The committed bundle is what the sources build
        run: |
          if ! git diff --quiet -- ../assets/index.html; then
            echo "::error::assets/index.html is not what Web/ builds. Run ./Deploy.ps1 and commit the result."
            git diff --stat -- ../assets/index.html
            exit 1
          fi

  # Process spawning, browser discovery, and the detached worker are all
  # platform-specific, and Windows is where the editor is used.
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Table Editor</title>
  </head>
  <body>
    <h1>Table Editor</h1>
    <p>
      This page stands in for the browser bundle. The bundle is committed at
      <code>assets/index.html</code>, which the server embeds, and this
      placeholder is what is committed there until one is built.
    </p>
    <p>
      The API is unaffected: <code>/api/app</code> lists the tables and
      <code>/api/&lt;table&gt;</code> reads and writes one.
    </p>
  </body>
</html>
